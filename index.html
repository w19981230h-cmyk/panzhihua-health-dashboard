          <span>AI慢病管理系统</span>
        </div>
        <nav class="main-nav" aria-label="主导航">
          <button class="nav-item dashboard" data-section="工作台"><svg><use href="#i-grid"/></svg><span>工作台</span></button>

          <div class="nav-group open">
            <button class="nav-item nav-toggle" data-section="任务管理" aria-expanded="true"><svg><use href="#i-task"/></svg><span>任务管理</span><b>⌃</b></button>
            <div class="nav-children"><div class="subnav">
              <button data-page="健康任务">健康任务</button><button data-page="预警任务">预警任务</button><button data-page="公卫任务清单">公卫任务清单</button><button data-page="打卡评价">打卡评价</button><button data-page="评价评估">评价评估</button>

          <div class="nav-group open current">
            <button class="nav-item nav-toggle" data-section="患者管理" aria-expanded="true"><svg><use href="#i-user"/></svg><span>患者管理</span><b>⌃</b></button>
            <div class="nav-children"><div class="subnav">
              <button class="active" data-page="全部患者">全部患者</button><button data-page="团队患者">团队患者</button>
            </div></div>
          </div>

          <div class="nav-group open">

            <div class="nav-children"><div class="subnav">

          </div>

          <div class="nav-group">
            <button class="nav-item nav-toggle" data-section="服务包管理" aria-expanded="false"><svg><use href="#i-box"/></svg><span>服务包管理</span><b>⌃</b></button>

            </div></div>

          <div class="nav-group open">
            <button class="nav-item nav-toggle" data-section="运营管理" aria-expanded="true"><svg><use href="#i-operation"/></svg><span>运营管理</span><b>⌃</b></button>

        </div>

      <main class="main-content">
        <h1 id="pageTitle">全部患者</h1>
        <section class="customer-card">
          <div class="toolbar">
            <label class="search-box"><svg><use href="#i-search"/></svg><input id="searchInput" type="search" placeholder="患者 姓名/就诊卡号/手机号码" /></label>
            <label class="team-select"><select id="teamSelect" required><option value="">请选择患者已加入团队</option><option>高血压规范管理</option><option>糖尿病健康管理</option><option>心脑血管康复管理</option><option>慢阻肺随访管理</option><option>代谢综合征管理</option></select></label>
            <div class="management-status-select ant-multi-select" id="managementStatusSelect">
              <div class="ant-select-selector" id="managementStatusTrigger" role="combobox" aria-haspopup="listbox" aria-expanded="false" tabindex="0">
                <div class="ant-select-selection-overflow" id="managementStatusTags"></div>
                <span class="ant-select-placeholder" id="managementStatusPlaceholder">请选择纳管状态</span>
                <button class="ant-select-clear" id="managementStatusClear" type="button" aria-label="清空纳管状态" hidden>×</button>
                <span class="ant-select-arrow" aria-hidden="true"></span>
              </div>
              <div class="ant-select-dropdown" id="managementStatusDropdown" role="listbox" aria-label="纳管状态" aria-multiselectable="true" hidden>
                <button class="ant-select-option" type="button" role="option" data-value="公卫已纳，医院待纳" aria-selected="false"><span>公卫已纳，医院待纳</span><i>✓</i></button>
                <button class="ant-select-option" type="button" role="option" data-value="医院已纳，公卫待纳" aria-selected="false"><span>医院已纳，公卫待纳</span><i>✓</i></button>
                <button class="ant-select-option" type="button" role="option" data-value="双方未纳管" aria-selected="false"><span>双方未纳管</span><i>✓</i></button>
              </div>
            </div>
            <button class="tool-button" id="moreFilter">更多筛选</button>
            <button class="icon-button" id="columnButton" aria-label="管理显示列"><svg><use href="#i-columns"/></svg></button>
          </div>
          <div class="advanced-filter" id="advancedFilter">
            <select id="genderFilter"><option value="">全部性别</option><option value="男">男</option><option value="女">女</option></select>
            <input id="minAge" type="number" min="0" placeholder="最小年龄" />
            <input id="maxAge" type="number" min="0" placeholder="最大年龄" />
            <button id="resetFilter">重置筛选</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr id="tableHead"></tr></thead>
              <tbody id="tableBody"></tbody>
            </table>
            <div class="empty-state" id="emptyState"><span>没有找到匹配的患者</span><button id="clearSearch">清空筛选</button></div>
          </div>
          <div class="pagination">
            <span id="totalText">共 28 条</span>
            <button class="page-arrow" id="prevPage">‹</button>
            <div id="pageButtons"></div>
            <button class="page-arrow" id="nextPage">›</button>
            <select id="pageSize"><option value="10" selected>10 条/页</option><option value="20">20 条/页</option></select>
            <span>跳至</span><input id="jumpPage" type="number" min="1" /><span>页</span>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast"></div>
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2 id="modalTitle">选择分组</h2><button id="closeModal">×</button></div><div class="modal-body" id="modalBody"></div></div>
    </div>
